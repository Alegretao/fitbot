<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FITBOT — Personal Trainer Interativo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app-shell">
    <!-- PALCO DO AVATAR -->
    <main class="stage-panel" aria-label="Palco do personal trainer animado">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1>FITBOT</h1>
        </div>

        <div class="persona-switch" role="radiogroup" aria-label="Escolher personal trainer">
          <button type="button" class="persona-btn active" data-persona="ramirez" role="radio" aria-checked="true">
            Ramirez
          </button>
          <button type="button" class="persona-btn" data-persona="jonesy" role="radio" aria-checked="false">
            Jonesy
          </button>
        </div>

        <div class="a11y-controls">
          <button type="button" id="btnMute" class="icon-btn" aria-pressed="false" title="Ativar/Desativar áudio">
            🔊 Som
          </button>
          <button type="button" id="btnStopAudio" class="icon-btn" title="Interromper fala">
            ⏹ Parar
          </button>
        </div>
      </header>

      <div class="canvas-wrapper">
        <canvas id="avatarCanvas" aria-label="Avatar animado do personal trainer"></canvas>

        <!-- Indicador visual de estado (acessibilidade visual) -->
        <div id="statePill" class="state-pill idle" role="status" aria-live="polite">
          <span class="pulse-dot"></span>
          <span id="stateText">Pronta para treinar</span>
        </div>

        <!-- Legenda ao vivo sobreposta opcional -->
        <div id="liveCaption" class="live-caption" aria-live="polite"></div>
      </div>
    </main>

    <!-- CHAT LATERAL ACESSÍVEL -->
    <aside class="chat-panel" aria-label="Histórico de conversa e entrada de mensagens">
      <div class="chat-header">
        <div>
          <h2 id="personaTitle">Ramirez</h2>
          <p id="personaSubtitle">Técnica, postura e evolução constante</p>
        </div>
        <button type="button" id="btnClear" class="clear-btn" title="Limpar conversa">Limpar</button>
      </div>

      <div id="chatLog" class="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>

      <form id="chatForm" class="chat-input-bar" autocomplete="off">
        <button
          type="button"
          id="btnMic"
          class="mic-btn"
          aria-pressed="false"
          aria-label="Falar no microfone (Alt+M)"
          title="Falar no microfone (Alt+M)"
        >
          🎙️
        </button>

        <label for="textInput" class="sr-only">Digite sua mensagem para o personal trainer</label>
        <input
          id="textInput"
          type="text"
          placeholder="Digite ou clique no microfone para falar..."
          required
        />

        <button type="submit" id="btnSend" class="send-btn" aria-label="Enviar mensagem">
          Enviar
        </button>
      </form>
    </aside>
  </div>

  <script src="{{ url_for('static', filename='js/avatarRig.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
