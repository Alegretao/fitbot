<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBot - Sua Personal Virtual</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>FIT<span>BOT</span></h1>
        <p>SUA PERSONAL TRAINER VIRTUAL</p>
    </header>

    <main class="container">

        <!-- ÁREA DOS AVATARES -->
        <section class="avatar-area">

            <div class="avatar-display" id="caixa-avatar">
                <canvas
                    id="avatar-canvas"
                    width="440"
                    height="560"
                    aria-label="Avatar animado da persona FitBot">
                </canvas>
            </div>

            <h2 id="nome-personagem">Jonesy</h2>

            <p class="status" id="status-avatar">● Online para conversar</p>

            <div class="selecao-personagem">

                <button
                    type="button"
                    onclick="selecionarAvatar('masculino')"
                    class="botao-avatar ativo"
                    id="btn-masculino">
                    Masculino
                </button>

                <button
                    type="button"
                    onclick="selecionarAvatar('feminino')"
                    class="botao-avatar"
                    id="btn-feminino">
                    Feminino
                </button>

            </div>

        </section>

        <!-- ÁREA DO CHAT -->
        <section class="chat-area">

            <div class="chat-header">
                <h2>Converse com a FitBot</h2>
                <p>Digite ou use o microfone. As respostas aparecem em texto e voz.</p>
            </div>

            <div class="messages" aria-live="polite">

                <div class="bot-message">
                    Olá! Eu sou o Jonesy. Como posso ajudar no seu treino hoje?
                </div>

                {% if resposta %}

                    <div class="user-message">
                        {{ mensagem }}
                    </div>

                    <div class="bot-message" id="ultima-resposta">
                        {{ resposta }}
                    </div>

                {% endif %}

            </div>

            <form method="POST" class="message-form">

                <input
                    type="text"
                    name="mensagem"
                    placeholder="Digite sua mensagem ou fale no microfone..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="btn-microfone"
                    class="mic-button"
                    title="Falar pelo microfone"
                    aria-label="Falar pelo microfone">
                    🎤
                </button>

                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
